name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk

    - name: Install Python Dependencies
      run: |
        python3.10 -m pip install --upgrade pip setuptools
        python3.10 -m pip install "cython<3.0.0" buildozer

    - name: Build APK with Buildozer
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | python3.10 -m buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
